<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <script src="scripts/script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Blackjack</h1>
    </header>
    <body>
      <!-- DEALERS HAND -->
      <h2>dealer's hand</h2>
      <div class="dealer-cards-visual">
        <img src="" alt="" />
        <img src="" alt="" />
      </div>
      <span> Dealer Total: </span>
      <span id="dealer-total"> 0 </span>
      <!-- YOUR HAND -->
      <h2>your hand</h2>
      <div class="your-cards-visual">
        <img src="" alt="" />
        <img src="" alt="" />
      </div>
      <span> Your Total: </span>
      <span id="your-total"> 0 </span>
      <div class="all-button-container">
        <button class="start-button" id="start-button">
          <p>Deal</p>
        </button>
        <button class="gameplay-button" id="hit-button">
          <p>Hit</p>
        </button>
        <button class="gameplay-button" id="stand-button">
          <p>Stand</p>
        </button>
        <button class="gameplay-button" id="double-down-button">
          <p>Double Down</p>
        </button>
        <button class="gameplay-button" id="split-button">
          <p>Split</p>
        </button>
      </div>
    </body>
  </body>
</html>
